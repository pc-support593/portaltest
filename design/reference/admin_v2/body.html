
<helmet>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">


</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="background:#1e3a5f;padding:0 24px;height:54px;display:flex;align-items:center;gap:14px">
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
      <div style="width:30px;height:30px;border-radius:7px;background:#2e6fc0;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">吉</div>
      <span style="font-size:15px;font-weight:700;color:#ffffff;white-space:nowrap">吉村一建設 ポータル</span>
      <span style="font-size:13px;color:#7f96b3">｜</span>
      <span style="font-size:13px;color:#a8bdd6;white-space:nowrap">管理画面</span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:18px">
      <a href="portal_v2.html" style="font-size:13px;color:#a8bdd6;white-space:nowrap" style-hover="color:#ffffff;text-decoration:none">← ポータルへ戻る</a>
      <div style="display:flex;align-items:center;gap:9px">
        <div style="width:32px;height:32px;border-radius:50%;background:#4a7fc0;color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">佐</div>
        <div style="display:flex;flex-direction:column;line-height:1.3">
          <span style="font-size:12px;font-weight:700;color:#ffffff;white-space:nowrap">佐藤 美咲</span>
          <span style="font-size:10px;color:#a8bdd6;white-space:nowrap">Portal.Admin</span>
        </div>
      </div>
    </div>
  </header>
  <div style="background:#fdf6e7;border-bottom:1px solid #f0e4c8;padding:9px 24px;display:flex;align-items:center;gap:9px">
    <span style="width:16px;height:16px;border-radius:50%;border:1.5px solid #b0872f;color:#b0872f;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">i</span>
    <span style="font-size:12px;color:#7a6420">この画面は Entra ID のアプリロール「Portal.Admin」を持つユーザーのみアクセスできます</span>
  </div>
  <div style="max-width:1560px;width:100%;margin:0 auto;padding:20px 24px 28px;display:flex;flex-direction:column;gap:16px;flex:1">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
        <button sc-camel-on-click="{{ t.select }}" style="display:flex;align-items:baseline;gap:7px;border:1px solid {{ t.border }};background:{{ t.bg }};color:{{ t.color }};font-weight:700;border-radius:9px;padding:11px 20px;font-size:13px;cursor:pointer;font-family:inherit" style-hover="border-color:#1e5fa8">
          <span>{{ t.label }}</span>
          <span style="font-size:11px;font-weight:500;color:{{ t.countColor }}">{{ t.count }}</span>
        </button>
      </sc-for>
      <button sc-camel-on-click="{{ openNew }}" style="margin-left:auto;border:none;background:#1e5fa8;color:#ffffff;font-weight:700;border-radius:9px;padding:11px 22px;font-size:13px;cursor:pointer;font-family:inherit" style-hover="background:#16497f">＋ 新規追加</button>
    </div>
    <section style="background:#ffffff;border-radius:12px;box-shadow:0 1px 3px rgba(30,60,100,0.08);overflow:hidden;flex:1">
      <div style="display:flex;align-items:center;gap:24px;padding:13px 24px;border-bottom:1px solid #e8edf3">
        <span style="font-size:12px;color:#8a99a8;width:90px;flex-shrink:0">{{ h1 }}</span>
        <span style="font-size:12px;color:#8a99a8;flex:1">{{ h2 }}</span>
        <span style="font-size:12px;color:#8a99a8;width:150px">{{ h3 }}</span>
        <span style="width:150px"></span>
      </div>
      <div style="display:flex;flex-direction:column">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
          <div style="display:flex;align-items:center;gap:24px;padding:13px 24px;border-bottom:1px solid #f2f5f9">
            <span style="font-size:13px;width:90px;flex-shrink:0;color:#1c2b3a">{{ r.c1 }}</span>
            <span style="font-size:13px;flex:1;min-width:0;color:#1c2b3a">{{ r.c2 }}</span>
            <span style="font-size:13px;width:150px;color:#6b7d8f">{{ r.c3 }}</span>
            <span style="width:150px;display:flex;gap:8px;justify-content:flex-end;flex-shrink:0">
              <button sc-camel-on-click="{{ r.edit }}" style="border:1px solid #c8dcf0;background:#ffffff;border-radius:7px;padding:5px 16px;cursor:pointer;color:#1e5fa8;font-size:12px;font-weight:500;font-family:inherit" style-hover="background:#e9f1fa">編集</button>
              <button sc-camel-on-click="{{ r.del }}" style="border:1px solid #e4eaf1;background:#ffffff;border-radius:7px;padding:5px 16px;cursor:pointer;color:#a8b5c2;font-size:12px;font-weight:500;font-family:inherit" style-hover="background:#fbeeee;color:#c05a5a;border-color:#f0d5d5">削除</button>
            </span>
          </div>
        </sc-for>
        <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
          <div style="padding:32px 24px;text-align:center;font-size:13px;color:#8a99a8">登録がありません。「＋ 新規追加」から追加してください。</div>
        </sc-if>
      </div>
    </section>
    <p style="margin:0;font-size:12px;color:#8a99a8">※ サンプルのため、編集内容はこのブラウザ内(ローカル)にのみ保存されます。</p>
  </div>
  <sc-if value="{{ formOpen }}" hint-placeholder-val="{{ false }}">
    <div sc-camel-on-click="{{ cancel }}" style="position:fixed;inset:0;background:rgba(20,40,65,0.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100">
      <div sc-camel-on-click="{{ stopClick }}" style="background:#ffffff;border-radius:16px;box-shadow:0 12px 40px rgba(15,35,60,0.3);max-width:620px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden">
        <div style="display:flex;align-items:center;gap:12px;padding:20px 26px;border-bottom:1px solid #e4ebf2">
          <h3 style="margin:0;font-size:17px;font-weight:700">{{ formTitle }}</h3>
          <button sc-camel-on-click="{{ cancel }}" style="margin-left:auto;border:none;background:#f0f4f8;border-radius:8px;width:32px;height:32px;cursor:pointer;color:#6b7d8f;font-size:15px;flex-shrink:0" style-hover="background:#e4ebf2">✕</button>
        </div>
        <div style="padding:20px 26px;overflow-y:auto;display:flex;flex-direction:column;gap:14px">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px">
            <sc-for list="{{ fields }}" as="f" hint-placeholder-count="3">
              <label style="display:flex;flex-direction:column;gap:5px">
                <span style="font-size:12px;font-weight:700;color:#6b7d8f">{{ f.label }}</span>
                <input value="{{ f.value }}" sc-camel-on-change="{{ f.onChange }}" placeholder="{{ f.placeholder }}" style="border:1px solid #dfe8f0;border-radius:8px;padding:9px 12px;font-size:14px;background:#f9fbfd" style-focus="border-color:#1e5fa8;outline:none;background:#ffffff">
              </label>
            </sc-for>
          </div>
          <sc-if value="{{ hasBody }}" hint-placeholder-val="{{ false }}">
            <label style="display:flex;flex-direction:column;gap:5px">
              <span style="display:flex;align-items:baseline;gap:10px">
                <span style="font-size:12px;font-weight:700;color:#6b7d8f">本文(詳細画面に表示)</span>
                <span style="margin-left:auto;font-size:12px;color:{{ bodyCountColor }}">{{ bodyCount }} / 500文字</span>
              </span>
              <textarea value="{{ bodyValue }}" sc-camel-on-change="{{ bodyChange }}" sc-camel-max-length="{{ bodyMax }}" rows="{{ bodyRows }}" placeholder="詳細を入力してください(最大500文字)。改行もそのまま表示されます。" style="border:1px solid #dfe8f0;border-radius:8px;padding:10px 12px;font-size:14px;background:#f9fbfd;line-height:1.7;resize:vertical" style-focus="border-color:#1e5fa8;outline:none;background:#ffffff"></textarea>
            </label>
          </sc-if>
        </div>
        <div style="padding:16px 26px;border-top:1px solid #e4ebf2;display:flex;gap:10px;justify-content:flex-end">
          <button sc-camel-on-click="{{ cancel }}" style="border:1px solid #dfe8f0;background:#ffffff;color:#6b7d8f;font-weight:500;border-radius:9px;padding:10px 18px;font-size:13px;cursor:pointer;font-family:inherit" style-hover="background:#f5f8fb">キャンセル</button>
          <button sc-camel-on-click="{{ save }}" style="border:none;background:#1e5fa8;color:#ffffff;font-weight:700;border-radius:9px;padding:10px 24px;font-size:13px;cursor:pointer;font-family:inherit" style-hover="background:#16497f">{{ saveLabel }}</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
