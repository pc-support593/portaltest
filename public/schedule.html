<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スケジュール - 吉村一建設 ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="background:#1e3a5f;padding:0 24px;height:54px;display:flex;align-items:center;gap:14px">
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
      <div style="width:30px;height:30px;border-radius:7px;background:#2e6fc0;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">吉</div>
      <span style="font-size:15px;font-weight:700;color:#ffffff;white-space:nowrap">吉村一建設 ポータル</span>
      <span style="font-size:13px;color:#7f96b3">｜</span>
      <span style="font-size:13px;color:#a8bdd6;white-space:nowrap">スケジュール</span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:18px">
      <a href="index.html" class="nav-link">← ポータルへ戻る</a>
      <div style="display:flex;align-items:center;gap:9px">
        <div data-me="avatar" style="width:32px;height:32px;border-radius:50%;background:#4a7fc0;color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700"></div>
        <div style="display:flex;flex-direction:column;line-height:1.3">
          <span data-me="name" style="font-size:12px;font-weight:700;color:#ffffff;white-space:nowrap"></span>
          <span data-me="dept" style="font-size:10px;color:#a8bdd6;white-space:nowrap"></span>
        </div>
      </div>
    </div>
  </header>

  <div style="max-width:1560px;width:100%;margin:0 auto;padding:18px 24px 28px;display:flex;flex-direction:column;gap:18px;flex:1">

    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button id="prev-day" class="hv-btn-light" style="border:1px solid #dfe8f0;background:#ffffff;border-radius:8px;width:32px;height:32px;cursor:pointer;color:#1e5fa8;font-size:14px;font-family:inherit">‹</button>
      <h1 id="date-label" style="margin:0;font-size:17px;font-weight:700;min-width:200px"></h1>
      <button id="next-day" class="hv-btn-light" style="border:1px solid #dfe8f0;background:#ffffff;border-radius:8px;width:32px;height:32px;cursor:pointer;color:#1e5fa8;font-size:14px;font-family:inherit">›</button>
      <button id="today-btn" class="hv-btn-plain" style="border:1px solid #dfe8f0;background:#ffffff;border-radius:8px;padding:7px 14px;cursor:pointer;color:#1c2b3a;font-size:12px;font-weight:500;font-family:inherit">今日</button>
    </div>

    <section style="background:#ffffff;border-radius:12px;box-shadow:0 1px 3px rgba(30,60,100,0.08);overflow:hidden">
      <div style="display:flex;align-items:center;gap:9px;padding:15px 20px;border-bottom:1px solid #e8edf3;flex-wrap:wrap">
        <span style="color:#1e5fa8;font-size:14px">▤</span>
        <h2 style="margin:0;font-size:15px;font-weight:700;white-space:nowrap">個人のスケジュール</h2>
        <span id="personal-badge" style="font-size:11px;font-weight:700;color:#2f6f8f;background:#e5f0f7;border-radius:4px;padding:2px 8px;white-space:nowrap">Outlook 連携</span>
        <button id="create-event" style="margin-left:auto;border:none;background:#1e5fa8;color:#ffffff;font-weight:700;border-radius:8px;padding:8px 16px;font-size:12px;cursor:pointer;font-family:inherit">＋ 予定を作成</button>
      </div>
      <div id="personal-events" style="padding:14px 20px;display:flex;flex-direction:column;gap:10px"></div>
    </section>

    <section style="background:#ffffff;border-radius:12px;box-shadow:0 1px 3px rgba(30,60,100,0.08);overflow:hidden">
      <div style="display:flex;align-items:center;gap:9px;padding:15px 20px;border-bottom:1px solid #e8edf3;flex-wrap:wrap">
        <span style="color:#1e5fa8;font-size:14px">◔</span>
        <h2 style="margin:0;font-size:15px;font-weight:700;white-space:nowrap">拠点別 会議室のスケジュール</h2>
        <span id="site-badge" style="font-size:11px;font-weight:700;color:#2f6f8f;background:#e5f0f7;border-radius:4px;padding:2px 8px;white-space:nowrap">Exchange 連携</span>
        <a href="rooms.html" style="margin-left:auto;font-size:12px;white-space:nowrap">会議室予約(デザインサンプル)へ</a>
      </div>
      <div id="site-grid" style="padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px"></div>
    </section>

  </div>
  <div id="modal-root"></div>
</div>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/roomsData.js"></script>
<script src="js/schedule.js"></script>
</body>
</html>
