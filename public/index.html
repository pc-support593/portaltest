<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>吉村一建設 ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="background:#1e3a5f;padding:0 24px;height:54px;display:flex;align-items:center;gap:22px">
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
      <div style="width:30px;height:30px;border-radius:7px;background:#2e6fc0;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">吉</div>
      <span style="font-size:15px;font-weight:700;color:#ffffff;white-space:nowrap">吉村一建設 ポータル</span>
    </div>
    <nav class="portal-nav" style="display:flex;align-items:center;gap:20px;min-width:0;overflow:hidden">
      <a href="index.html" class="nav-link active">ホーム</a>
      <a href="#" class="nav-link">社内規程</a>
      <a href="#" class="nav-link">組織図</a>
      <a href="rooms.html" class="nav-link">会議室予約</a>
      <a href="schedule.html" class="nav-link">スケジュール</a>
      <a href="admin.html" class="nav-link">管理</a>
    </nav>
    <div style="margin-left:auto;display:flex;align-items:center;gap:14px;min-width:0;flex-shrink:1">
      <input placeholder="社内検索(規程・人・ドキュメント)" class="portal-search header-search" style="background:rgba(255,255,255,0.12);border:none;border-radius:16px;padding:8px 16px;font-size:12px;color:#ffffff;width:250px;max-width:100%;min-width:60px;flex-shrink:1;font-family:inherit">
      <div style="position:relative;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;color:#ffffff;font-size:14px;cursor:pointer">
        <span>🔔</span>
        <span style="position:absolute;top:2px;right:3px;width:8px;height:8px;border-radius:50%;background:#e05c5c;border:2px solid #1e3a5f"></span>
      </div>
      <div style="display:flex;align-items:center;gap:9px">
        <div data-me="avatar" style="width:32px;height:32px;border-radius:50%;background:#4a7fc0;color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700"></div>
        <div style="display:flex;flex-direction:column;line-height:1.3">
          <span data-me="name" style="font-size:12px;font-weight:700;color:#ffffff;white-space:nowrap"></span>
          <span data-me="dept" style="font-size:10px;color:#a8bdd6;white-space:nowrap"></span>
        </div>
      </div>
        <a href="#" id="logout-link" class="nav-link" style="display:none;font-size:12px">ログアウト</a>
    </div>
  </header>
  <div style="max-width:1560px;width:100%;margin:0 auto;padding:18px 24px 28px;display:flex;flex-direction:column;gap:16px;flex:1">
    <div style="display:flex;align-items:baseline;gap:14px">
      <h1 id="greeting" style="margin:0;font-size:19px;font-weight:700"></h1>
      <span id="today" style="font-size:13px;color:#6b7d8f"></span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:18px;align-items:start">

      <div id="col-left" style="display:flex;flex-direction:column;gap:18px">
        <section id="sec-news" data-section="news" style="background:#ffffff;border-radius:12px;box-shadow:0 1px 3px rgba(30,60,100,0.08);overflow:hidden">
          <div style="display:flex;align-items:center;gap:9px;padding:15px 20px;border-bottom:1px solid #e8edf3">
            <span class="drag-handle" title="ドラッグして並び替え" style="cursor:grab;color:#b5c3d1;font-size:14px">⠿</span>
            <span style="color:#1e5fa8;font-size:14px">◈</span>
            <h2 style="margin:0;font-size:15px;font-weight:700">お知らせ</h2>
            <a href="#" style="margin-left:auto;font-size:12px">すべて見る</a>
          </div>
          <div id="news-list" style="display:flex;flex-direction:column;padding:4px 0"></div>
        </section>

        <section id="sec-links" data-section="links" style="background:#ffffff;border-radius:12px;box-shadow:0 1px 3px rgba(30,60,100,0.08);overflow:hidden">
          <div style="display:flex;align-items:center;gap:9px;padding:15px 20px;border-bottom:1px solid #e8edf3">
            <span class="drag-handle" title="ドラッグして並び替え" style="cursor:grab;color:#b5c3d1;font-size:14px">⠿</span>
            <span style="color:#1e5fa8;font-size:14px">⊞</span>
            <h2 style="margin:0;font-size:15px;font-weight:700">クイックリンク</h2>
          </div>
          <div id="quick-links" style="padding:18px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px"></div>
        </section>
      </div>

      <div id="col-right" style="display:flex;flex-direction:column;gap:18px">
        <section id="sec-today" data-section="today" style="background:#ffffff;border-radius:12px;box-shadow:0 1px 3px rgba(30,60,100,0.08);overflow:hidden">
          <div style="display:flex;align-items:center;gap:9px;padding:15px 20px;border-bottom:1px solid #e8edf3">
            <span class="drag-handle" title="ドラッグして並び替え" style="cursor:grab;color:#b5c3d1;font-size:14px">⠿</span>
            <span style="color:#1e5fa8;font-size:14px">▤</span>
            <h2 style="margin:0;font-size:15px;font-weight:700;white-space:nowrap">今日の予定</h2>
            <span style="font-size:11px;font-weight:700;color:#2f6f8f;background:#e5f0f7;border-radius:4px;padding:2px 8px;white-space:nowrap">Outlook 連携</span>
            <a href="schedule.html" style="margin-left:auto;font-size:12px;white-space:nowrap">スケジュールを見る</a>
          </div>
          <div id="today-events" style="padding:14px 20px;display:flex;flex-direction:column;gap:10px"></div>
        </section>

        <section id="sec-schedule" data-section="schedule" style="background:#ffffff;border-radius:12px;box-shadow:0 1px 3px rgba(30,60,100,0.08);overflow:hidden">
          <div style="display:flex;align-items:center;gap:9px;padding:15px 20px;border-bottom:1px solid #e8edf3">
            <span class="drag-handle" title="ドラッグして並び替え" style="cursor:grab;color:#b5c3d1;font-size:14px">⠿</span>
            <span style="color:#1e5fa8;font-size:14px">◔</span>
            <h2 style="margin:0;font-size:15px;font-weight:700">全社スケジュール</h2>
            <a href="#" style="margin-left:auto;font-size:12px">年間予定表</a>
          </div>
          <div id="schedule-list" style="display:flex;flex-direction:column;padding:6px 0"></div>
        </section>

        <section id="sec-tasks" data-section="tasks" style="background:#ffffff;border-radius:12px;box-shadow:0 1px 3px rgba(30,60,100,0.08);overflow:hidden">
          <div style="display:flex;align-items:center;gap:9px;padding:15px 20px;border-bottom:1px solid #e8edf3">
            <span class="drag-handle" title="ドラッグして並び替え" style="cursor:grab;color:#b5c3d1;font-size:14px">⠿</span>
            <span style="color:#1e5fa8;font-size:14px">☑</span>
            <h2 style="margin:0;font-size:15px;font-weight:700">タスク・承認待ち</h2>
            <span id="task-count" style="margin-left:auto;font-size:11px;font-weight:700;color:#b0721f;background:#fdf4e7;border-radius:10px;padding:3px 10px"></span>
          </div>
          <div id="task-list" style="display:flex;flex-direction:column;padding:4px 0"></div>
        </section>
      </div>

    </div>
  </div>
  <footer style="padding:14px 24px;text-align:center;font-size:12px;color:#8a99a8">© 株式会社吉村一建設 社内ポータル ｜ お問い合わせ: 総務部 内線100</footer>
  <div id="modal-root"></div>
</div>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/portal.js"></script>
</body>
</html>
