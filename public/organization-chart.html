<!DOCTYPE html>
<html lang="ja">
<head>
<!-- サインインの確認が済むまで画面を表示しない(ログイン前に画面が一瞬見えるのを防ぐ。2026-10-12・ユーザー指示)。js/auth.js の Auth.init が完了/失敗で解除する。 -->
<style>html.auth-pending body{visibility:hidden}</style>
<script>(function(){var c=document.documentElement.classList;c.add('auth-pending');setTimeout(function(){c.remove('auth-pending');},10000);window.addEventListener('pageshow',function(e){if(e.persisted)c.remove('auth-pending');});})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>組織図 - 吉村一建設 ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
<style>
  /* 組織図(2026-10-20)。上から ①会長・社長 ②専務 ③部門長 ④次長 ⑤メンバー。印刷(PDF保存)は A3 横 */
  .oc-scroll { overflow-x: auto; padding-bottom: 12px; }
  #oc-chart { width: max-content; min-width: 100%; display: flex; flex-direction: column; align-items: center; } /* 部門が多い・小区分(本社・平野など)が横に並ぶと、図が広がる。画面は横にスクロール */
  .oc-top { display: flex; flex-direction: column; align-items: center; }
  .oc-box { border: 1px solid #b9c7d6; border-radius: 6px; background: #ffffff; padding: 6px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 150px; }
  .oc-l1 { background: #1e3a5f; border-color: #1e3a5f; color: #ffffff; }
  .oc-l2 { background: #e9f1fa; border-color: #9fbbdc; }
  .oc-l3 { background: #f4f8fc; border-color: #9fbbdc; }
  .oc-l4 { background: #ffffff; border-color: #c4d2e1; }
  .oc-p { display: flex; gap: 10px; align-items: baseline; justify-content: center; font-size: 13px; }
  .oc-title { font-size: 11px; opacity: .8; white-space: nowrap; }
  .oc-name { font-weight: 700; white-space: nowrap; }
  .oc-vline { width: 2px; height: 18px; background: #9fbbdc; }
  .oc-vline.oc-short { height: 8px; }
  .oc-cols { display: flex; align-items: flex-start; justify-content: center; width: max-content; }
  /* 部門ごとの列。上の横線(母線)は、列ごとの ::after をつないで引く(最初の列は中央から、最後の列は中央まで) */
  .oc-col { flex: 0 0 auto; min-width: 170px; display: flex; flex-direction: column; align-items: stretch; position: relative; padding: 14px 5px 0; }
  .oc-col::before { content: ''; position: absolute; top: 0; left: calc(50% - 1px); width: 2px; height: 14px; background: #9fbbdc; }
  .oc-col::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: #9fbbdc; }
  .oc-col:first-child::after { left: 50%; }
  .oc-col:last-child::after { right: 50%; }
  .oc-col:only-child::after { display: none; }
  .oc-dept { text-align: center; font-weight: 700; font-size: 13px; background: #2e6fc0; color: #ffffff; border-radius: 6px 6px 0 0; padding: 6px 4px; }
  .oc-col .oc-box { min-width: 0; border-radius: 6px; align-self: center; width: 100%; max-width: 230px; }
  .oc-col > .oc-vline { align-self: center; }
  .oc-vline.oc-short { height: 10px; }
  .oc-col .oc-dept { border-radius: 6px; }
  /* 小区分(工務部の本社・平野・西宮、ゆめすみかの展示場など)は、横に並べる */
  .oc-members { border: 1px solid #c4d2e1; background: #ffffff; padding: 6px 8px; display: flex; flex-direction: row; align-items: flex-start; gap: 0; margin-top: 0; border-radius: 6px; }
  .oc-section { display: flex; flex-direction: column; gap: 2px; min-width: 150px; padding: 0 8px; border-left: 1px solid #e1e8f0; }
  /* カスタマーサポート室の左の線(spine)と、そこにぶら下げる部門(事業係など)。母線の左端から下へ伸ばす */
  .oc-col.oc-has-side { padding-left: 30px; }
  .oc-col.oc-has-side::before { left: calc(50% + 14px); }
  .oc-col.oc-has-side::after { left: 14px; } /* 母線を、spine の位置まで左へ伸ばす */
  .oc-col.oc-has-side { align-self: stretch; }
  .oc-spine { position: absolute; left: 14px; top: 0; bottom: -14px; width: 2px; background: #9fbbdc; } /* 母線の左端から下へ。下の段(事業係などの部門)の上端まで */
  /* 下の段(ゆめすみかの展示場など): 元の部門の列から下へ線を引き、すべての列の下に横に並べる */
  .oc-tier-link { align-self: stretch; }
  .oc-dropline { align-self: center; flex: 1 1 auto; min-height: 24px; width: 0; border-left: 2px solid #9fbbdc; margin-top: 0; }
  .oc-tiers { position: relative; align-self: stretch; margin-top: 14px; } /* 下の段(位置はJSで決める) */
  .oc-tier { position: absolute; display: flex; flex-direction: column; }
  /* 工務事務の箱: 3部門(カスタマーサポート室・リフォーム部・工務部)の下に置く。人数で大きさが変わり、人は最大2列(左の列→右の列の順に均等に) */
  .oc-jimu { width: max-content; min-width: 150px; }
  .oc-jimu .oc-tier-title { text-align: center; }
  .oc-jimu-grid { display: grid; grid-auto-flow: column; gap: 6px 22px; justify-content: center; border: 1px solid #c4d2e1; border-top: none; background: #ffffff; padding: 8px 14px; border-radius: 0 0 6px 6px; }
  .oc-jm { font-size: 12px; font-weight: 700; color: #1c2b3a; white-space: nowrap; }
  .oc-tier[data-kind=side] { width: 175px; }
  .oc-tier[data-kind=side]::before { content: ''; position: absolute; left: calc(50% - 1px); top: -12px; width: 2px; height: 12px; background: #9fbbdc; }
  .oc-sidebus { position: absolute; top: 0; height: 2px; background: #9fbbdc; }
  .oc-tier[data-kind=side] .oc-tier-title { text-align: center; }
  .oc-tier-title { font-weight: 700; font-size: 13px; background: #2e6fc0; color: #ffffff; border-radius: 6px 6px 0 0; padding: 5px 10px; }
  .oc-tier .oc-members { margin-top: 0; border-radius: 0 0 6px 6px; }
  .oc-section:first-child { border-left: none; padding-left: 0; }
  .oc-section:last-child { padding-right: 0; }
  .oc-section-label { font-size: 11px; font-weight: 700; color: #1e5fa8; border-bottom: 1px dashed #c4d2e1; margin-bottom: 2px; white-space: nowrap; }
  .oc-m { display: flex; gap: 6px; align-items: baseline; font-size: 12px; }
  .oc-m .oc-title { min-width: 2.4em; color: #4a5b6c; opacity: 1; }
  .oc-added .oc-name::after { content: '(兼)'; font-size: 10px; font-weight: 400; color: #8a99a8; margin-left: 2px; }
  @page { size: A3 landscape; margin: 10mm; }
  @media print {
    header, .oc-noprint { display: none !important; }
    body { background: #ffffff; }
    .oc-scroll { overflow: visible; }
    .oc-members, .oc-box, .oc-dept { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="background:#1e3a5f;padding:0 24px;height:54px;display:flex;align-items:center;gap:14px">
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
      <div style="width:30px;height:30px;border-radius:7px;background:#2e6fc0;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">吉</div>
      <span style="font-size:15px;font-weight:700;color:#ffffff;white-space:nowrap">吉村一建設/ゆめすみか ポータル</span>
      <span style="font-size:13px;color:#7f96b3">｜</span>
      <span style="font-size:13px;color:#a8bdd6;white-space:nowrap">組織図</span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:18px">
      <a href="index.html" class="nav-link">← ポータルへ戻る</a>
      <div style="display:flex;align-items:center;gap:9px">
        <div data-me="avatar" style="width:32px;height:32px;border-radius:50%;background:#4a7fc0;color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700"></div>
        <div style="display:flex;flex-direction:column;line-height:1.3">
          <span data-me="name" style="font-size:12px;font-weight:700;color:#ffffff;white-space:nowrap"></span>
          <span data-me="dept" style="font-size:10px;color:#a8bdd6;white-space:nowrap"></span>
        </div>
      </div>
      <a href="#" id="logout-link" class="nav-link" style="display:none;font-size:12px">ログアウト</a>
    </div>
  </header>

  <div style="max-width:1640px;width:100%;margin:0 auto;padding:18px 24px 28px;display:flex;flex-direction:column;gap:10px;flex:1">
    <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
      <h1 style="margin:0;font-size:19px;font-weight:700">株式会社吉村一建設グループ 組織図</h1>
      <span class="oc-noprint" style="font-size:12px;color:#8a99a8">社員名簿の情報から自動で作成します。課長以下の役職と兼任は、管理画面の「組織図の役職」で入力します。</span>
      <button id="oc-print" type="button" class="oc-noprint hv-btn-primary" style="margin-left:auto;border:none;background:#1e5fa8;color:#ffffff;font-weight:700;border-radius:8px;padding:8px 16px;font-size:12px;font-family:inherit;cursor:pointer">PDFで保存(印刷)</button>
    </div>
    <p id="oc-notice" class="oc-noprint" style="margin:0;font-size:12px;color:#c05a5a"></p>
    <div class="oc-scroll"><div id="oc-chart"></div></div>
    <p class="oc-noprint" style="margin:0;font-size:11px;color:#8a99a8">「PDFで保存(印刷)」を押し、印刷画面の送信先で「PDFに保存」を選びます(用紙は A3 横)。</p>
  </div>
</div>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/roomsData.js"></script>
<script src="js/orgData.js"></script>
<script src="js/orgChart.js"></script>
<script>initOrgChartPage();</script>
</body>
</html>
