<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理画面 - 吉村一建設 ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="background:#1e3a5f;padding:0 24px;height:54px;display:flex;align-items:center;gap:14px">
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
      <div style="width:30px;height:30px;border-radius:7px;background:#2e6fc0;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">吉</div>
      <span style="font-size:15px;font-weight:700;color:#ffffff;white-space:nowrap">吉村一建設 ポータル</span>
      <span style="font-size:13px;color:#7f96b3">｜</span>
      <span style="font-size:13px;color:#a8bdd6;white-space:nowrap">管理画面</span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:18px">
      <a href="index.html" class="nav-link">← ポータルへ戻る</a>
      <div style="display:flex;align-items:center;gap:9px">
        <div data-me="avatar" style="width:32px;height:32px;border-radius:50%;background:#4a7fc0;color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700"></div>
        <div style="display:flex;flex-direction:column;line-height:1.3">
          <span data-me="name" style="font-size:12px;font-weight:700;color:#ffffff;white-space:nowrap"></span>
          <span style="font-size:10px;color:#a8bdd6;white-space:nowrap">Portal.Admin</span>
        </div>
      </div>
    </div>
  </header>
  <div style="background:#fdf6e7;border-bottom:1px solid #f0e4c8;padding:9px 24px;display:flex;align-items:center;gap:9px">
    <span style="width:16px;height:16px;border-radius:50%;border:1.5px solid #b0872f;color:#b0872f;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">i</span>
    <span style="font-size:12px;color:#7a6420">この画面は Entra ID のアプリロール「Portal.Admin」を持つユーザーのみアクセスできます</span>
  </div>
  <div style="max-width:1560px;width:100%;margin:0 auto;padding:20px 24px 28px;display:flex;flex-direction:column;gap:16px;flex:1">
    <div id="tab-row" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"></div>
    <section style="background:#ffffff;border-radius:12px;box-shadow:0 1px 3px rgba(30,60,100,0.08);overflow:hidden;flex:1">
      <div id="table-head" style="display:flex;align-items:center;gap:24px;padding:13px 24px;border-bottom:1px solid #e8edf3"></div>
      <div id="table-body" style="display:flex;flex-direction:column"></div>
    </section>
  </div>
  <div id="modal-root"></div>
</div>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
