<!DOCTYPE html>
<html lang="ja">
<head>
<!-- サインインの確認が済むまで画面を表示しない(ログイン前に画面が一瞬見えるのを防ぐ。2026-10-12・ユーザー指示)。js/auth.js の Auth.init が完了/失敗で解除する。保険として10秒で解除。ブラウザの「戻る」(bfcache復帰)でも直ちに解除 -->
<style>html.auth-pending body{visibility:hidden}</style>
<script>(function(){var c=document.documentElement.classList;c.add('auth-pending');setTimeout(function(){c.remove('auth-pending');},10000);window.addEventListener('pageshow',function(e){if(e.persisted)c.remove('auth-pending');});})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>社内報へ移動中 - 吉村一建設 ポータル</title>
<link rel="stylesheet" href="css/portal.css">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
  <p id="igrace-status" style="margin:0;font-size:14px;color:#6b7d8f">社内報にログインしています…</p>
</div>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/igraceLogin.js"></script>
</body>
</html>
