<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会議室予約 - 吉村一建設 ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
<style>
  @media (max-width: 900px) { .room-layout { padding-left: 12px !important; padding-right: 12px !important; } }
</style>
</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="background:#1e3a5f;padding:0 24px;height:54px;display:flex;align-items:center;gap:14px">
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
      <div style="width:30px;height:30px;border-radius:7px;background:#2e6fc0;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">吉</div>
      <span style="font-size:15px;font-weight:700;color:#ffffff;white-space:nowrap">吉村一建設 ポータル</span>
      <span style="font-size:13px;color:#7f96b3">｜</span>
      <span style="font-size:13px;color:#a8bdd6;white-space:nowrap">会議室予約</span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:18px">
      <span id="exchange-badge" style="font-size:11px;font-weight:700;color:#bcd4ef;background:rgba(255,255,255,0.12);border-radius:4px;padding:3px 9px;white-space:nowrap">Exchange 連携</span>
      <a href="schedule.html" class="nav-link">スケジュールへ</a>
      <a href="index.html" class="nav-link">← ポータルへ戻る</a>
      <div style="display:flex;align-items:center;gap:9px">
        <div data-me="avatar" style="width:32px;height:32px;border-radius:50%;background:#4a7fc0;color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700"></div>
        <div style="display:flex;flex-direction:column;line-height:1.3">
          <span data-me="name" style="font-size:12px;font-weight:700;color:#ffffff;white-space:nowrap"></span>
          <span data-me="dept" style="font-size:10px;color:#a8bdd6;white-space:nowrap"></span>
        </div>
      </div>
        <a href="#" id="logout-link" class="nav-link" style="display:none;font-size:12px">ログアウト</a>
    </div>
  </header>
  <div id="site-tabs" style="max-width:1560px;width:100%;margin:0 auto;padding:18px 24px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap"></div>
  <div id="room-tabs" style="max-width:1560px;width:100%;margin:0 auto;padding:12px 24px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap"></div>
  <div class="room-layout" style="max-width:1560px;width:100%;margin:0 auto;padding:16px 24px 28px;display:flex;flex-direction:column;gap:18px;flex:1">
    <section id="calendar-card" style="background:#ffffff;border-radius:12px;box-shadow:0 1px 3px rgba(30,60,100,0.08);overflow:hidden"></section>
  </div>
  <div id="modal-root"></div>
</div>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/roomsData.js"></script>
<script src="js/rooms.js"></script>
</body>
</html>
